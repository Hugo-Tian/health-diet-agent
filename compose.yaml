services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: diet
      POSTGRES_USER: diet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diet -d diet"]
      interval: 5s
      timeout: 5s
      retries: 12
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://diet:${POSTGRES_PASSWORD}@db:5432/diet
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8000}
      LLM_MODE: ${LLM_MODE:-demo}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-20}
      AGENT_TIMEOUT: ${AGENT_TIMEOUT:-45}
      LANGCHAIN_TRACING_V2: "false"
      LANGSMITH_TRACING: "false"
    restart: unless-stopped
volumes:
  postgres_data:
